name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/web_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/web_ci.yml'

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build
