name: One-time department code strictness fixer

on:
  push:
    branches:
      - complete/fleet-web-foundation
    paths:
      - .github/workflows/hr_null_safety_fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: complete/fleet-web-foundation

      - name: Restore required department code
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/types.ts')
          text = path.read_text()
          old = "export interface Department {\n  id: string;\n  companyId: string;\n  name: string;\n  code?: string;"
          new = "export interface Department {\n  id: string;\n  companyId: string;\n  name: string;\n  code: string;"
          if old not in text:
              raise SystemExit('Department compatibility block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "FleetOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/types.ts
          git commit -m "fix: restore strict department code invariant"
          git push origin HEAD:complete/fleet-web-foundation
