name: One-time FleetOS safety fixer

on:
  push:
    branches:
      - complete/fleet-web-foundation
    paths:
      - .github/workflows/fleet_production_safety_fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: complete/fleet-web-foundation

      - name: Patch FleetContext safety rules
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/context/FleetContext.tsx')
          text = path.read_text()
          old = "const [isLiveSimulating, setIsLiveSimulating] = useState<boolean>(true);"
          new = "const [isLiveSimulating, setIsLiveSimulating] = useState<boolean>(() => import.meta.env.VITE_ENABLE_DEMO_TELEMETRY === 'true');"
          if old not in text:
              raise SystemExit('simulation default not found')
          text = text.replace(old, new, 1)
          old = "// Telemetry real-time movement ticker"
          new = "// Demo-only movement ticker. Production telemetry stays provider-authoritative unless explicitly enabled."
          if old not in text:
              raise SystemExit('ticker comment not found')
          text = text.replace(old, new, 1)
          old = "        showToast('warning', 'Compliance Gate', 'Vehicle requires at least one verified inspection or PUC certificate before activation.');\n      }"
          new = "        showToast('warning', 'Compliance Gate', 'Vehicle requires at least one verified compliance document before activation.');\n        return { success: false, error: 'Verified compliance document required before activation' };\n      }"
          if old not in text:
              raise SystemExit('compliance gate not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit
        run: |
          git config user.name "FleetOS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/context/FleetContext.tsx
          git commit -m "fix: require authoritative telemetry and compliance activation"
          git push origin HEAD:complete/fleet-web-foundation
